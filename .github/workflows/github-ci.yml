name: Build and Deploy

on:
  # Triggers the workflow on push or pull request events but only for the selected branches
  push:
    branches: [ test-stable, community ]
  pull_request:
    branches: [ test-stable, community ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failures }}
    name: ${{ matrix.name }} / ${{ matrix.config }}
    strategy:
      matrix:
        config: [Debug, Release]
        include:
        # for the matrix leg matching the os and version
        - os: ubuntu-24.04
          name: Ubuntu 24.04 (.NET 10.0)
          toolchain: dotnet-sdk-10.0
          allow_failures: false

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (dotnet)
        run: |
          dotnet restore src/Blizzless-D3.sln
          dotnet msbuild src/Blizzless-D3.sln /t:Build /p:Configuration=${{ matrix.config }}

  docker:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    # Only run on push to main branches, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/test-stable' || github.ref == 'refs/heads/community')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
